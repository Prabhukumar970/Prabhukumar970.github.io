<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DealFinder - Flipkart Deals</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#222;
}

/* HEADER */

header{
    background:#ffffff;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#ff6b00;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-weight:600;
}


/* HERO */

.hero{
    background:linear-gradient(120deg,#fff1e6,#ffffff);
    padding:55px 7%;
    text-align:center;
}

.hero h1{
    font-size:45px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    color:#666;
}


/* SEARCH */

.search-area{
    max-width:900px;
    margin:-25px auto 30px;
    padding:0 20px;
    position:relative;
}

.search-box{
    background:white;
    padding:12px;
    border-radius:10px;
    display:flex;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:16px;
    padding:10px;
}

.search-box button{
    border:none;
    background:#ff6b00;
    color:white;
    padding:10px 20px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}


/* FILTER */

.filters{
    max-width:1200px;
    margin:auto;
    padding:10px 20px 25px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.filters select{
    padding:10px 14px;
    border:1px solid #ddd;
    background:white;
    border-radius:7px;
    cursor:pointer;
}


/* PRODUCTS */

.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px 50px;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.heading h2{
    font-size:27px;
}


.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}


/* CARD */

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 25px rgba(0,0,0,.15);
}


.image-box{
    height:220px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
}

.image-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:15px;
}


.discount{
    position:absolute;
    top:10px;
    left:10px;
    background:#e53935;
    color:white;
    padding:6px 9px;
    border-radius:5px;
    font-size:13px;
    font-weight:bold;
    z-index:2;
}


.card-body{
    padding:15px;
}

.title{
    font-size:16px;
    font-weight:bold;
    line-height:1.4;
    height:45px;
    overflow:hidden;
}

.category{
    color:#777;
    font-size:13px;
    margin:8px 0;
}

.price{
    font-size:22px;
    font-weight:bold;
    margin-top:8px;
}

.mrp{
    font-size:14px;
    color:#888;
    text-decoration:line-through;
    margin-left:5px;
}

.deal-btn{
    display:block;
    text-align:center;
    background:#ff6b00;
    color:white;
    text-decoration:none;
    padding:11px;
    border-radius:7px;
    margin-top:15px;
    font-weight:bold;
}

.deal-btn:hover{
    background:#e85d00;
}


/* EMPTY */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#777;
}


/* FOOTER */

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:30px;
    line-height:2;
}


/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    nav{
        display:none;
    }

    .hero{
        padding:40px 20px;
    }

    .hero h1{
        font-size:32px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .image-box{
        height:160px;
    }

    .card-body{
        padding:10px;
    }

    .title{
        font-size:14px;
    }

    .price{
        font-size:18px;
    }

    .deal-btn{
        font-size:13px;
        padding:9px;
    }
}

</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        🔥 Deal<span>Finder</span>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#deals">Deals</a>
        <a href="#electronics">Electronics</a>
        <a href="#fashion">Fashion</a>
    </nav>

</header>



<!-- HERO -->

<section class="hero">

    <h1>🔥 Today's Best Deals</h1>

    <p>
        Find the latest discounts and offers in one place.
    </p>

</section>



<!-- SEARCH -->

<div class="search-area">

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

        <button onclick="searchProducts()">
            Search
        </button>

    </div>

</div>



<!-- FILTER -->

<div class="filters">

    <select id="category">

        <option value="all">
            All Categories
        </option>

        <option value="Electronics">
            Electronics
        </option>

        <option value="Fashion">
            Fashion
        </option>

        <option value="Home">
            Home
        </option>

        <option value="Beauty">
            Beauty
        </option>

    </select>


    <select id="discount">

        <option value="0">
            Any Discount
        </option>

        <option value="30">
            30%+ OFF
        </option>

        <option value="50">
            50%+ OFF
        </option>

        <option value="70">
            70%+ OFF
        </option>

    </select>

</div>



<!-- PRODUCTS -->

<main class="container" id="deals">

    <div class="heading">

        <h2>
            🔥 Latest Deals
        </h2>

        <span id="count"></span>

    </div>


    <div
        class="products"
        id="products"
    ></div>

</main>



<!-- FOOTER -->

<footer>

    <strong>DealFinder</strong>

    <br>

    Find deals. Compare prices. Save money.

    <br>

    Product details and purchases are completed on the respective shopping website.

</footer>



<script>

/*
=================================================
PRODUCT DATA
=================================================

YAHAN PRODUCTS ADD KARO.

IMPORTANT:
url mein actual Flipkart product URL डालना.

=================================================
*/


const products = [

    {
        title:"Example Wireless Headphones",
        category:"Electronics",
        price:999,
        mrp:2499,
        discount:60,
        image:"https://via.placeholder.com/400x400?text=Headphones",
        url:"https://www.flipkart.com/"
    },


    {
        title:"Example Smart Watch",
        category:"Electronics",
        price:1299,
        mrp:3999,
        discount:68,
        image:"https://via.placeholder.com/400x400?text=Smart+Watch",
        url:"https://www.flipkart.com/"
    },


    {
        title:"Men Casual T-Shirt",
        category:"Fashion",
        price:499,
        mrp:1299,
        discount:62,
        image:"https://via.placeholder.com/400x400?text=T-Shirt",
        url:"https://www.flipkart.com/"
    },


    {
        title:"Home Decorative Lamp",
        category:"Home",
        price:699,
        mrp:1599,
        discount:56,
        image:"https://via.placeholder.com/400x400?text=Lamp",
        url:"https://www.flipkart.com/"
    },


    {
        title:"Beauty Skin Care Kit",
        category:"Beauty",
        price:799,
        mrp:1999,
        discount:60,
        image:"https://via.placeholder.com/400x400?text=Beauty",
        url:"https://www.flipkart.com/"
    }

];



/*
=================================================
DISPLAY PRODUCTS
=================================================
*/


function displayProducts(list){

    const container =
        document.getElementById("products");

    container.innerHTML="";


    document.getElementById("count").innerText =
        list.length + " deals";


    if(list.length === 0){

        container.innerHTML = `

            <div class="empty">

                😔

                <h3>
                    No deals found
                </h3>

                <p>
                    Try another search or category.
                </p>

            </div>

        `;

        return;

    }


    list.forEach(product => {

        const card =
            document.createElement("div");

        card.className="card";


        card.innerHTML = `

            <div class="image-box">

                <span class="discount">

                    ${product.discount}% OFF

                </span>


                <img
                    src="${product.image}"
                    alt="${product.title}"
                    loading="lazy"
                >

            </div>


            <div class="card-body">

                <div class="title">

                    ${product.title}

                </div>


                <div class="category">

                    ${product.category}

                </div>


                <div class="price">

                    ₹${product.price.toLocaleString("en-IN")}

                    <span class="mrp">

                        ₹${product.mrp.toLocaleString("en-IN")}

                    </span>

                </div>


                <a
                    href="${product.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="deal-btn"
                >

                    View Deal →

                </a>

            </div>

        `;


        container.appendChild(card);

    });

}



/*
=================================================
FILTER
=================================================
*/


function filterProducts(){

    const category =
        document.getElementById("category").value;


    const discount =
        Number(
            document.getElementById("discount").value
        );


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
        products.filter(product => {


            const categoryMatch =
                category === "all" ||
                product.category === category;


            const discountMatch =
                product.discount >= discount;


            const searchMatch =
                product.title
                .toLowerCase()
                .includes(search);


            return(
                categoryMatch &&
                discountMatch &&
                searchMatch
            );

        });


    displayProducts(filtered);

}



document
    .getElementById("category")
    .addEventListener(
        "change",
        filterProducts
    );


document
    .getElementById("discount")
    .addEventListener(
        "change",
        filterProducts
    );


document
    .getElementById("search")
    .addEventListener(
        "input",
        filterProducts
    );



function searchProducts(){

    filterProducts();

    document
        .getElementById("deals")
        .scrollIntoView({
            behavior:"smooth"
        });

}



/*
=================================================
START
=================================================
*/

displayProducts(products);

</script>


</body>
</html>
